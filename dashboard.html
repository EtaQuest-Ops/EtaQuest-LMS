<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
      <div class="brand-name" data-brand-name>EtaQuest</div>
    </div>

    <nav class="nav-group" id="nav-group"></nav>

    <div class="sidebar-footer">
      <a href="profile.html" class="user-name" id="user-name" style="text-decoration:none; display:block; color:inherit;">—</a>
      <div class="role-line" id="role-line">—</div>
      <a href="profile.html" class="btn btn-ghost btn-sm btn-block" style="margin-bottom:8px; text-decoration:none;">Profile</a>
      <button class="btn btn-ghost btn-sm btn-block" onclick="eq_logout()">Log out</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="welcome-line" id="welcome-line"></div>
        <h1 id="page-title">Overview</h1>
        <div class="school-tag" id="school-tag">—</div>
      </div>
      <div id="topbar-actions"></div>
    </div>

    <div class="content" id="content">
      <div class="empty-state"><h3>Loading…</h3></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  let session = null;
  let previewSchoolId = null;

  const navGroup = document.getElementById("nav-group");
  const content = document.getElementById("content");
  const pageTitle = document.getElementById("page-title");
  const topbarActions = document.getElementById("topbar-actions");

  function roleLabel(role) {
    return { admin: "Super Admin", hod: "Head of Department", educator: "Educator" }[role] || role;
  }

  function progressBarHTML(completed, total) {
    const pct = total ? Math.round((completed / total) * 100) : 0;
    return `
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      <span class="progress-label">${completed}/${total} modules (${pct}%)</span>
    `;
  }

  // Simple category-based inline icon used when a course has no image_url yet.
  function fallbackImageHTML(category) {
    const icons = {
      "Electronics & Programming": "🔌",
      "Artificial Intelligence": "🤖",
      "Robotics": "⚙️",
      "Robotics & Construction": "🧩"
    };
    const icon = icons[category] || "📘";
    return `<div class="course-card-image course-card-image-fallback">${icon}</div>`;
  }

  function licenseBadgeHTML(course) {
    if (!course.license) return "";
    const cls = { active: "license-active", expired: "license-expired", upcoming: "license-upcoming", unset: "license-unset" }[course.license.status];
    return `<span class="license-pill ${cls}" style="margin-bottom:8px;">${eq_escapeHtml(course.license.label)}</span>`;
  }

  function courseCardHTML(course) {
    const hasProgress = course.modules_completed !== undefined;
    return `
      <a class="course-card" href="course.html?id=${course.id}">
        ${
          course.image_url
            ? `<img class="course-card-image" src="${course.image_url}" alt="${eq_escapeHtml(course.title)}">`
            : fallbackImageHTML(course.category)
        }
        <div class="course-card-hover">
          <p>${eq_escapeHtml(course.summary || "")}</p>
        </div>
        <div class="card-body">
          ${licenseBadgeHTML(course)}
          <span class="category">${eq_escapeHtml(course.category || "")}</span>
          <h3>${eq_escapeHtml(course.title)}</h3>
          ${hasProgress ? `<div class="progress-wrap">${progressBarHTML(course.modules_completed, course.total_modules)}</div>` : ""}
        </div>
        <div class="card-footer">
          <span class="btn btn-ghost btn-sm btn-block">Open course</span>
        </div>
      </a>
    `;
  }

  /* ---------------- Educator view ---------------- */
  async function renderEducatorView() {
    pageTitle.textContent = "My courses";
    navGroup.innerHTML = `<div class="nav-label">Classroom</div><div class="nav-item active">My courses</div>`;

    const courses = await eq_getCourses();

    if (!courses.length) {
      content.innerHTML = `<div class="panel"><div class="empty-state"><h3>No courses assigned yet</h3><p>Your admin hasn't assigned any curricula to your account.</p></div></div>`;
      return;
    }

    content.innerHTML = `
      <div class="section-heading">
        <h2>Assigned to you</h2>
        <span class="count">${courses.length} curriculum${courses.length > 1 ? "s" : ""}</span>
      </div>
      <div class="course-grid">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- HOD view ---------------- */
  async function renderHodView() {
    pageTitle.textContent = "Department overview";
    navGroup.innerHTML = `
      <div class="nav-label">Department</div>
      <div class="nav-item active">Overview</div>
      <a class="nav-item" href="reports.html" style="text-decoration:none;">Educator reports</a>
    `;

    const courses = await eq_getCourses();

    content.innerHTML = `
      <div class="panel" style="padding:20px 24px; display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
        <div>
          <h2 style="font-size:16px; margin-bottom:4px;">Educator reports</h2>
          <p style="font-size:13px; color:var(--color-ink-soft); margin:0;">See curriculum completion and login activity for every educator in your school.</p>
        </div>
        <a href="reports.html" class="btn btn-primary">View reports</a>
      </div>

      <div class="section-heading">
        <h2>Licensed curricula — ${eq_escapeHtml(session.school ? session.school.name : "")}</h2>
        <span class="count">${courses.length} total</span>
      </div>
      <div class="course-grid">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- Admin view ---------------- */
  async function renderAdminView() {
    pageTitle.textContent = "Admin overview";
    navGroup.innerHTML = `
      <div class="nav-label">Manage</div>
      <div class="nav-item active">Overview</div>
      <a class="nav-item" href="admin-access.html" style="text-decoration:none;">Course access &amp; licensing</a>
      <a class="nav-item" href="admin-users.html" style="text-decoration:none;">Users</a>
      <a class="nav-item" href="admin-change-requests.html" style="text-decoration:none;">Change requests</a>
    `;

    const schools = session.schools || [];
    if (!previewSchoolId && schools.length) previewSchoolId = schools[0].id;

    topbarActions.innerHTML = `
      <select id="admin-school-select" style="padding:8px 12px; border:1px solid var(--color-line); border-radius:4px; font-family:var(--font-body);">
        ${schools.map(s => `<option value="${s.id}" ${s.id === previewSchoolId ? "selected" : ""}>${eq_escapeHtml(s.name)}</option>`).join("")}
      </select>
    `;
    document.getElementById("admin-school-select").addEventListener("change", async (e) => {
      previewSchoolId = e.target.value;
      const meData = await eq_me(previewSchoolId);
      eq_applyBranding(meData.school);
      document.getElementById("school-tag").textContent = meData.school.name;
      await renderAdminView();
    });

    const [courses, educators, allSchools] = await Promise.all([
      eq_getCourses(previewSchoolId),
      eq_getReports(previewSchoolId),
      eq_getSchools()
    ]);

    content.innerHTML = `
      <div class="section-heading">
        <h2>Licensed curricula</h2>
        <span class="count">${courses.length} of 4 total curricula</span>
      </div>
      <div class="course-grid" style="margin-bottom:32px;">${courses.map(courseCardHTML).join("")}</div>

      <div class="panel">
        <div class="panel-header"><h2>Educators at this school</h2></div>
        <table>
          <thead><tr><th>Name</th><th>Role</th><th>Logins</th><th>Assigned curricula</th></tr></thead>
          <tbody>
            ${
              educators.length
                ? educators.map(e => `
                  <tr>
                    <td>${eq_escapeHtml(e.name)}</td>
                    <td><span class="badge badge-educator">Educator</span></td>
                    <td>${e.loginCount}</td>
                    <td>${e.courses.map(c => eq_escapeHtml(c.title)).join(", ") || "—"}</td>
                  </tr>
                `).join("")
                : `<tr><td colspan="4" style="color:var(--color-ink-soft)">No educators at this school yet.</td></tr>`
            }
          </tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>All schools</h2></div>
        <table>
          <thead><tr><th>School</th><th>Curricula licensed</th></tr></thead>
          <tbody>
            ${allSchools.map(s => `<tr><td>${eq_escapeHtml(s.name)}</td><td>${s.course_count}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  (async () => {
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    document.getElementById("user-name").textContent = session.user.name;
    document.getElementById("role-line").textContent = roleLabel(session.user.role);
    document.getElementById("welcome-line").textContent = `Welcome, ${session.user.name}`;

    if (session.school) {
      eq_applyBranding(session.school);
      document.getElementById("school-tag").textContent = session.school.name;
    } else {
      document.getElementById("school-tag").textContent = "All schools";
    }

    if (session.user.role === "admin") {
      await renderAdminView();
    } else if (session.user.role === "hod") {
      await renderHodView();
    } else {
      await renderEducatorView();
    }
  })();
</script>

</body>
</html>
