<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <nav class="rail">
    <div class="rail-logo"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-footer" id="rail-footer"></div>
  </nav>

  <main class="workspace">
    <header class="workspace-header">
      <div>
        <div class="workspace-eyebrow" id="workspace-eyebrow"></div>
        <h1 id="workspace-title">Overview</h1>
        <div class="workspace-sub" id="workspace-sub"></div>
      </div>
      <div class="workspace-actions" id="workspace-actions"></div>
    </header>
    <div class="workspace-content" id="content">
      <div class="empty-state"><h3>Loading…</h3></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
  let session = null;
  let previewSchoolId = null;
  let selectedSchoolIdForDetail = null;

  const content = document.getElementById("content");
  const workspaceActions = document.getElementById("workspace-actions");

  const CATEGORY_COLORS = {
    "Electronics & Programming": "#2563AC",
    "Artificial Intelligence": "#F8804C",
    "Robotics": "#1E8E5A",
    "Robotics & Construction": "#6D4AAE"
  };
  const CATEGORY_ICONS = {
    "Electronics & Programming": "🔌",
    "Artificial Intelligence": "🤖",
    "Robotics": "⚙️",
    "Robotics & Construction": "🧩"
  };

  function licenseChipHTML(course) {
    if (!course.license) return "";
    const cls = { active: "license-active", expired: "license-expired", upcoming: "license-upcoming", unset: "license-unset" }[course.license.status];
    return `<span class="cc-license-chip license-pill ${cls}">${eq_escapeHtml(course.license.label)}</span>`;
  }

  function courseCardHTML(course) {
    const hasProgress = course.modules_completed !== undefined;
    const pct = hasProgress && course.total_modules ? Math.round((course.modules_completed / course.total_modules) * 100) : null;
    const color = CATEGORY_COLORS[course.category] || "#053757";
    return `
      <a class="eq-course-card" style="--cat-color:${color};" href="course.html?id=${course.id}">
        ${
          course.image_url
            ? `<img class="eq-course-card-image" src="${course.image_url}" alt="${eq_escapeHtml(course.title)}">`
            : `<div class="eq-course-card-image eq-course-card-image-fallback">${CATEGORY_ICONS[course.category] || "📘"}</div>`
        }
        ${licenseChipHTML(course)}
        <div class="cc-body">
          <span class="cc-category">${eq_escapeHtml(course.category || "")}</span>
          <h3>${eq_escapeHtml(course.title)}</h3>
          ${pct !== null ? `<div class="progress-wrap"><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${course.modules_completed}/${course.total_modules} modules</span></div>` : ""}
        </div>
      </a>
    `;
  }

  /* ---------------- Educator view ---------------- */
  async function renderEducatorView() {
    eq_renderRailNav([{ href: null, icon: "book", label: "My courses", active: true }]);
    eq_renderWorkspaceHeader({ eyebrow: `Welcome, ${session.user.name}`, title: "My courses" });

    const courses = await eq_getCourses();

    if (!courses.length) {
      content.innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("book", 30)}<h3>No courses assigned yet</h3><p>Your admin hasn't assigned any curricula to your account.</p></div></div>`;
      return;
    }

    const inProgress = courses.find(c => c.modules_completed > 0 && c.modules_completed < c.total_modules) || courses[0];
    const totalModules = courses.reduce((s, c) => s + (c.total_modules || 0), 0);
    const completedModules = courses.reduce((s, c) => s + (c.modules_completed || 0), 0);
    const rate = totalModules ? Math.round((completedModules / totalModules) * 100) : 0;
    const heroBg = inProgress.image_url ? `background-image:url('${inProgress.image_url}');` : "";

    content.innerHTML = `
      <div class="hero-card" style="${heroBg}">
        <div class="hero-card-content">
          <div class="hero-eyebrow">${inProgress.modules_completed > 0 ? "Continue learning" : "Get started"}</div>
          <div class="hero-title">${eq_escapeHtml(inProgress.title)}</div>
          <div class="hero-sub">${eq_escapeHtml(inProgress.summary || "")}</div>
          <a href="course.html?id=${inProgress.id}" class="btn btn-white btn-lg">${eq_icon("book", 16)} ${inProgress.modules_completed > 0 ? "Resume" : "Start"} curriculum</a>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stats-strip-item"><div class="ss-value">${courses.length}</div><div class="ss-label">Assigned curricula</div></div>
        <div class="stats-strip-item"><div class="ss-value">${completedModules}/${totalModules}</div><div class="ss-label">Lessons completed</div></div>
        <div class="stats-strip-item"><div class="ss-value">${rate}%</div><div class="ss-label">Overall completion</div></div>
      </div>

      <div class="section-heading"><h2>All your curricula</h2><span class="count">${courses.length} total</span></div>
      <div class="course-rail">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- HOD view ---------------- */
  async function renderHodView() {
    eq_renderRailNav([
      { href: null, icon: "home", label: "Overview", active: true },
      { href: "reports.html", icon: "chart", label: "Educator reports" }
    ]);
    eq_renderWorkspaceHeader({ eyebrow: `Welcome, ${session.user.name}`, title: "Department overview", sub: session.school ? session.school.name : "" });

    const [courses, educators] = await Promise.all([eq_getCourses(), eq_getReports()]);
    const totalLogins = educators.reduce((s, e) => s + e.loginCount, 0);
    let totalDone = 0, totalPossible = 0;
    educators.forEach(e => e.courses.forEach(c => { totalDone += c.modules_completed; totalPossible += c.total_modules; }));
    const avgRate = totalPossible ? Math.round((totalDone / totalPossible) * 100) : 0;

    content.innerHTML = `
      <div class="hero-card" style="background-color: var(--brand-primary);">
        <div class="hero-card-content">
          <div class="hero-eyebrow">Department</div>
          <div class="hero-title">See how your educators are progressing</div>
          <div class="hero-sub">Curriculum completion and login activity for every educator in your school, in one view.</div>
          <a href="reports.html" class="btn btn-white btn-lg">${eq_icon("chart", 16)} View reports</a>
        </div>
      </div>

      <div class="stats-strip">
        <div class="stats-strip-item"><div class="ss-value">${educators.length}</div><div class="ss-label">Educators</div></div>
        <div class="stats-strip-item"><div class="ss-value">${avgRate}%</div><div class="ss-label">Avg. completion</div></div>
        <div class="stats-strip-item"><div class="ss-value">${totalLogins}</div><div class="ss-label">Total sign-ins</div></div>
      </div>

      <div class="section-heading"><h2>Licensed curricula</h2><span class="count">${courses.length} total</span></div>
      <div class="course-rail">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- Admin view: master-detail, not dropdown+tabs ---------------- */
  async function renderAdminView() {
    eq_renderRailNav([
      { href: null, icon: "home", label: "Overview", active: true },
      { href: "admin-access.html", icon: "shield", label: "Course access & licensing" },
      { href: "admin-users.html", icon: "users", label: "Users" },
      { href: "admin-change-requests.html", icon: "clipboard", label: "Change requests" }
    ]);
    eq_renderWorkspaceHeader({ eyebrow: `Welcome, ${session.user.name}`, title: "Admin overview", sub: "All schools" });

    const schools = session.schools || [];
    selectedSchoolIdForDetail = selectedSchoolIdForDetail || schools[0]?.id;

    const [allSchools, changeRequests] = await Promise.all([eq_getSchools(), eq_getChangeRequests().catch(() => [])]);
    const pendingCount = changeRequests.filter(r => r.status === "pending").length;

    content.innerHTML = `
      <div class="stats-strip">
        <div class="stats-strip-item"><div class="ss-value">${allSchools.length}</div><div class="ss-label">Schools</div></div>
        <div class="stats-strip-item"><div class="ss-value">${pendingCount}</div><div class="ss-label">Pending change requests</div></div>
        <div class="stats-strip-item"><div class="ss-value">4</div><div class="ss-label">Total curricula</div></div>
      </div>

      <div class="section-heading"><h2>Schools</h2></div>
      <div class="md-layout">
        <div class="md-list" id="md-school-list">
          ${schools.map(s => `
            <div class="md-list-item${s.id === selectedSchoolIdForDetail ? " active" : ""}" data-school-id="${s.id}">
              <span>${eq_escapeHtml(s.name)}</span>
              <span class="md-count">${allSchools.find(a => a.id === s.id)?.course_count ?? "—"}</span>
            </div>
          `).join("")}
        </div>
        <div class="md-detail" id="md-detail">
          <div class="empty-state"><h3>Loading…</h3></div>
        </div>
      </div>
    `;

    document.querySelectorAll(".md-list-item").forEach(item => {
      item.addEventListener("click", async () => {
        selectedSchoolIdForDetail = item.dataset.schoolId;
        document.querySelectorAll(".md-list-item").forEach(i => i.classList.toggle("active", i === item));
        await renderSchoolDetail(selectedSchoolIdForDetail);
      });
    });

    if (selectedSchoolIdForDetail) await renderSchoolDetail(selectedSchoolIdForDetail);
  }

  async function renderSchoolDetail(schoolId) {
    const detail = document.getElementById("md-detail");
    detail.innerHTML = `<div class="empty-state"><h3>Loading…</h3></div>`;

    const [courses, educators] = await Promise.all([eq_getCourses(schoolId), eq_getReports(schoolId)]);

    detail.innerHTML = `
      <div class="section-heading"><h2>Licensed curricula</h2><span class="count">${courses.length} of 4</span></div>
      <div class="course-grid" style="margin-bottom:28px;">${courses.map(courseCardHTML).join("")}</div>

      <div class="section-heading"><h2>Educators</h2><span class="count">${educators.length}</span></div>
      ${
        educators.length
          ? `<div class="panel"><div class="user-row-list">
              ${educators.map(e => `
                <div class="user-row">
                  ${eq_avatar(e.name, 34)}
                  <div>
                    <div class="user-row-name">${eq_escapeHtml(e.name)}</div>
                    <div class="user-row-sub">${eq_escapeHtml(e.courses.map(c => c.title).join(", ") || "No curricula assigned")}</div>
                  </div>
                  <div class="user-row-meta"><div class="stat-chip"><div class="chip-value">${e.loginCount}</div><div class="chip-label">Logins</div></div></div>
                </div>
              `).join("")}
            </div></div>`
          : `<div class="panel"><div class="empty-state">${eq_icon("users", 26)}<h3>No educators yet</h3></div></div>`
      }
    `;
  }

  (async () => {
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    eq_renderRailFooter(session.user);
    if (session.school) eq_applyBranding(session.school);

    if (session.user.role === "admin") {
      await renderAdminView();
    } else if (session.user.role === "hod") {
      await renderHodView();
    } else {
      await renderEducatorView();
    }
  })();
</script>

</body>
</html>
