<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
      <div class="brand-name" data-brand-name>EtaQuest</div>
    </div>

    <nav class="nav-group" id="nav-group"></nav>

    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="welcome-line" id="welcome-line"></div>
        <h1 id="page-title">Overview</h1>
        <div class="school-tag" id="school-tag">—</div>
      </div>
      <div class="topbar-right">
        <div id="topbar-actions"></div>
        <div id="topbar-utilities" style="display:flex; gap:8px; align-items:center;"></div>
      </div>
    </div>

    <div class="content" id="content">
      <div class="empty-state"><h3>Loading…</h3></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  let session = null;
  let previewSchoolId = null;

  const navGroup = document.getElementById("nav-group");
  const content = document.getElementById("content");
  const pageTitle = document.getElementById("page-title");
  const topbarActions = document.getElementById("topbar-actions");

  function statCardHTML(icon, label, value, sub) {
    return `
      <div class="stat-card">
        <div class="stat-label">${eq_icon(icon, 15)} ${label}</div>
        <div class="stat-value">${value}</div>
        ${sub ? `<div class="stat-sub">${sub}</div>` : ""}
      </div>
    `;
  }

  function progressBarHTML(completed, total) {
    const pct = total ? Math.round((completed / total) * 100) : 0;
    return `
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <span class="progress-label">${completed}/${total} modules (${pct}%)</span>
    `;
  }

  const CATEGORY_ICONS = {
    "Electronics & Programming": "🔌",
    "Artificial Intelligence": "🤖",
    "Robotics": "⚙️",
    "Robotics & Construction": "🧩"
  };

  function licenseBadgeHTML(course) {
    if (!course.license) return "";
    const cls = { active: "license-active", expired: "license-expired", upcoming: "license-upcoming", unset: "license-unset" }[course.license.status];
    return `<span class="license-pill ${cls}" style="margin-bottom:8px;">${eq_escapeHtml(course.license.label)}</span>`;
  }

  function courseCardHTML(course) {
    const hasProgress = course.modules_completed !== undefined;
    return `
      <a class="course-card" href="course.html?id=${course.id}">
        ${
          course.image_url
            ? `<img class="course-card-image" src="${course.image_url}" alt="${eq_escapeHtml(course.title)}">`
            : `<div class="course-card-image course-card-image-fallback">${CATEGORY_ICONS[course.category] || "📘"}</div>`
        }
        <div class="course-card-hover"><p>${eq_escapeHtml(course.summary || "")}</p></div>
        <div class="card-body">
          ${licenseBadgeHTML(course)}
          <span class="category">${eq_escapeHtml(course.category || "")}</span>
          <h3>${eq_escapeHtml(course.title)}</h3>
          ${hasProgress ? `<div class="progress-wrap">${progressBarHTML(course.modules_completed, course.total_modules)}</div>` : ""}
        </div>
        <div class="card-footer"><span class="btn btn-ghost btn-sm btn-block">Open course</span></div>
      </a>
    `;
  }

  /* ---------------- Educator view ---------------- */
  async function renderEducatorView() {
    pageTitle.textContent = "My courses";
    navGroup.innerHTML = `
      <div class="nav-label">Classroom</div>
      <div class="nav-item active">${eq_icon("book", 16)} My courses</div>
    `;

    const courses = await eq_getCourses();

    if (!courses.length) {
      content.innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("book", 30)}<h3>No courses assigned yet</h3><p>Your admin hasn't assigned any curricula to your account.</p></div></div>`;
      return;
    }

    const totalModules = courses.reduce((s, c) => s + (c.total_modules || 0), 0);
    const completedModules = courses.reduce((s, c) => s + (c.modules_completed || 0), 0);
    const rate = totalModules ? Math.round((completedModules / totalModules) * 100) : 0;

    content.innerHTML = `
      <div class="stat-grid">
        ${statCardHTML("book", "Assigned curricula", courses.length)}
        ${statCardHTML("checkCircle", "Lessons completed", `${completedModules}/${totalModules}`)}
        ${statCardHTML("chart", "Overall completion", `${rate}%`)}
      </div>
      <div class="section-heading">
        <h2>Assigned to you</h2>
        <span class="count">${courses.length} curriculum${courses.length > 1 ? "s" : ""}</span>
      </div>
      <div class="course-grid">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- HOD view ---------------- */
  async function renderHodView() {
    pageTitle.textContent = "Department overview";
    navGroup.innerHTML = `
      <div class="nav-label">Department</div>
      <div class="nav-item active">${eq_icon("home", 16)} Overview</div>
      <a class="nav-item" href="reports.html">${eq_icon("chart", 16)} Educator reports</a>
    `;

    const [courses, educators] = await Promise.all([eq_getCourses(), eq_getReports()]);
    const totalLogins = educators.reduce((s, e) => s + e.loginCount, 0);
    let totalDone = 0, totalPossible = 0;
    educators.forEach(e => e.courses.forEach(c => { totalDone += c.modules_completed; totalPossible += c.total_modules; }));
    const avgRate = totalPossible ? Math.round((totalDone / totalPossible) * 100) : 0;

    content.innerHTML = `
      <div class="stat-grid">
        ${statCardHTML("users", "Educators", educators.length)}
        ${statCardHTML("chart", "Avg. completion", `${avgRate}%`)}
        ${statCardHTML("clock", "Total sign-ins", totalLogins)}
      </div>

      <div class="panel" style="padding:20px 24px; display:flex; align-items:center; justify-content:space-between;">
        <div>
          <h2 style="font-size:15px; margin-bottom:4px;">Educator reports</h2>
          <p style="font-size:13px; color:var(--color-ink-soft); margin:0;">See curriculum completion and login activity for every educator in your school.</p>
        </div>
        <a href="reports.html" class="btn btn-primary">View reports</a>
      </div>

      <div class="section-heading">
        <h2>Licensed curricula — ${eq_escapeHtml(session.school ? session.school.name : "")}</h2>
        <span class="count">${courses.length} total</span>
      </div>
      <div class="course-grid">${courses.map(courseCardHTML).join("")}</div>
    `;
  }

  /* ---------------- Admin view ---------------- */
  async function renderAdminView() {
    pageTitle.textContent = "Admin overview";
    navGroup.innerHTML = `
      <div class="nav-label">Manage</div>
      <div class="nav-item active">${eq_icon("home", 16)} Overview</div>
      <a class="nav-item" href="admin-access.html">${eq_icon("shield", 16)} Course access &amp; licensing</a>
      <a class="nav-item" href="admin-users.html">${eq_icon("users", 16)} Users</a>
      <a class="nav-item" href="admin-change-requests.html">${eq_icon("clipboard", 16)} Change requests</a>
    `;

    const schools = session.schools || [];
    if (!previewSchoolId && schools.length) previewSchoolId = schools[0].id;

    topbarActions.innerHTML = `
      <select id="admin-school-select">
        ${schools.map(s => `<option value="${s.id}" ${s.id === previewSchoolId ? "selected" : ""}>${eq_escapeHtml(s.name)}</option>`).join("")}
      </select>
    `;
    document.getElementById("admin-school-select").addEventListener("change", async (e) => {
      previewSchoolId = e.target.value;
      const meData = await eq_me(previewSchoolId);
      eq_applyBranding(meData.school);
      document.getElementById("school-tag").textContent = meData.school.name;
      await renderAdminView();
    });

    const [courses, educators, allSchools, changeRequests] = await Promise.all([
      eq_getCourses(previewSchoolId),
      eq_getReports(previewSchoolId),
      eq_getSchools(),
      eq_getChangeRequests().catch(() => [])
    ]);
    const pendingCount = changeRequests.filter(r => r.status === "pending").length;

    content.innerHTML = `
      <div class="stat-grid">
        ${statCardHTML("building", "Schools", allSchools.length)}
        ${statCardHTML("book", "Licensed curricula", courses.length, "at this school")}
        ${statCardHTML("users", "Educators", educators.length, "at this school")}
        ${statCardHTML("clipboard", "Pending requests", pendingCount)}
      </div>

      <div class="section-heading">
        <h2>Licensed curricula</h2>
        <span class="count">${courses.length} of 4 total curricula</span>
      </div>
      <div class="course-grid" style="margin-bottom:28px;">${courses.map(courseCardHTML).join("")}</div>

      <div class="panel">
        <div class="panel-header"><h2>Educators at this school</h2></div>
        <table>
          <thead><tr><th>Educator</th><th>Logins</th><th>Assigned curricula</th></tr></thead>
          <tbody>
            ${
              educators.length
                ? educators.map(e => `
                  <tr>
                    <td><div class="table-user-cell">${eq_avatar(e.name, 28)} <span class="name">${eq_escapeHtml(e.name)}</span></div></td>
                    <td>${e.loginCount}</td>
                    <td>${e.courses.map(c => eq_escapeHtml(c.title)).join(", ") || "—"}</td>
                  </tr>
                `).join("")
                : `<tr><td colspan="3" style="color:var(--color-ink-faint)">No educators at this school yet.</td></tr>`
            }
          </tbody>
        </table>
      </div>

      <div class="panel">
        <div class="panel-header"><h2>All schools</h2></div>
        <table>
          <thead><tr><th>School</th><th>Curricula licensed</th></tr></thead>
          <tbody>
            ${allSchools.map(s => `<tr><td>${eq_escapeHtml(s.name)}</td><td>${s.course_count}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>
    `;
  }

  (async () => {
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    eq_renderSidebarFooter(session.user);
    eq_renderTopbarUtilities();
    document.getElementById("welcome-line").textContent = `Welcome, ${session.user.name}`;

    if (session.school) {
      eq_applyBranding(session.school);
      document.getElementById("school-tag").textContent = session.school.name;
    } else {
      document.getElementById("school-tag").textContent = "All schools";
    }

    if (session.user.role === "admin") {
      await renderAdminView();
    } else if (session.user.role === "hod") {
      await renderHodView();
    } else {
      await renderEducatorView();
    }
  })();
</script>

</body>
</html>
