<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Course — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
      <div class="brand-name" data-brand-name>EtaQuest</div>
    </div>
    <nav class="nav-group">
      <div class="nav-label">Classroom</div>
      <a class="nav-item" href="dashboard.html" id="nav-my-courses"></a>
    </nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <a class="back-link" href="dashboard.html">&larr; Back to my courses</a>
        <h1 id="course-title">Loading…</h1>
        <div class="school-tag" id="school-tag">—</div>
      </div>
      <div class="topbar-right">
        <div id="topbar-utilities" style="display:flex; gap:8px; align-items:center;"></div>
      </div>
    </div>

    <div class="content">
      <div id="license-banner"></div>
      <div class="course-viewer" id="course-viewer"></div>
    </div>
  </div>

</div>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
<script>
  let session, course, lessons, currentLesson, currentView = "lecture";

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.add("show");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove("show"), 4000);
  }

  function lessonStatusOf(lesson) {
    if (!lesson) return null;
    if (lesson.completed_at) return "completed";
    if (lesson.opened_at) return "opened";
    return "not-opened";
  }

  function statusBadgeHTML(status) {
    const map = {
      "completed": { label: "Completed", cls: "status-completed" },
      "opened": { label: "Opened", cls: "status-opened" },
      "not-opened": { label: "Not opened", cls: "status-not-opened" }
    };
    const s = map[status] || map["not-opened"];
    return `<span class="status-badge ${s.cls}">${s.label}</span>`;
  }

  function watermarkHTML() {
    const label = `${eq_escapeHtml(session.user.name)} · ${eq_escapeHtml(session.user.email)} · ${new Date().toLocaleDateString()}`;
    let tiles = "";
    for (let i = 0; i < 6; i++) tiles += `<span>${label}</span>`;
    return `<div class="embed-watermark" aria-hidden="true">${tiles}</div>`;
  }

  function embedBodyHTML() {
    let inner;
    if (!currentLesson) {
      inner = `<div class="placeholder-note">No lessons added yet for "${eq_escapeHtml(course.title)}".</div>`;
    } else if (currentView === "lecture") {
      inner = currentLesson.embed_url
        ? `<iframe src="${currentLesson.embed_url}" style="width:100%;height:100%;border:none;" allow="fullscreen" allowfullscreen></iframe>`
        : `<div class="placeholder-note">Canva smart-embed will render here once linked.<code>embed_url is empty for "${eq_escapeHtml(currentLesson.title)}"</code></div>`;
    } else if (currentView === "plan") {
      inner = currentLesson.lesson_plan_embed_url
        ? `<iframe src="${currentLesson.lesson_plan_embed_url}" style="width:100%;height:100%;border:none;" allow="fullscreen" allowfullscreen></iframe>`
        : `<div class="placeholder-note">Lesson plan viewer will render here once a Canva link is added.<code>lesson_plan_embed_url is empty for "${eq_escapeHtml(currentLesson.title)}"</code></div>`;
    } else {
      inner = currentLesson.outline_embed_url
        ? `<iframe src="${currentLesson.outline_embed_url}" style="width:100%;height:100%;border:none;" allow="fullscreen" allowfullscreen></iframe>`
        : `<div class="placeholder-note">Outline viewer will render here once a Canva link is added.<code>outline_embed_url is empty for "${eq_escapeHtml(currentLesson.title)}"</code></div>`;
    }
    return inner + watermarkHTML();
  }

  function renderViewTabs() {
    const tabs = [
      { key: "lecture", label: "Lecture" },
      { key: "plan", label: "Lesson Plan" },
      { key: "outline", label: "Outline" }
    ];
    return `<div class="view-tabs">${tabs.map(t =>
      `<button class="view-tab${currentView === t.key ? " active" : ""}" data-view="${t.key}">${t.label}</button>`
    ).join("")}</div>`;
  }

  function lessonPlanDownloadHTML() {
    if (currentLesson && currentLesson.lesson_plan_url) {
      return `<a class="btn btn-ghost btn-sm btn-block" href="${currentLesson.lesson_plan_url}" target="_blank" rel="noopener">${eq_icon("fileText", 14)} Download lesson plan (.docx)</a>`;
    }
    return `<p style="font-size:12px; color:var(--color-ink-faint); margin:0;">No downloadable lesson plan document uploaded yet.</p>`;
  }

  function moduleListHTML() {
    const isEducator = session.user.role === "educator";
    return `
      <div class="module-list">
        ${lessons.map(l => {
          const status = isEducator ? lessonStatusOf(l) : null;
          const dotClass = status === "completed" ? "completed" : status === "opened" ? "opened" : "";
          return `
            <button class="module-item${l.id === currentLesson.id ? " active" : ""}" data-lesson-id="${l.id}">
              <span class="module-num">${l.sort_order}</span>
              <span>${eq_escapeHtml(l.title)}</span>
              ${isEducator ? `<span class="module-status-dot ${dotClass}"></span>` : ""}
            </button>
          `;
        }).join("")}
      </div>
    `;
  }

  async function selectLesson(lessonId) {
    currentLesson = lessons.find(l => l.id === lessonId);
    if (session.user.role === "educator" && currentLesson) {
      try {
        await eq_setLessonStatus(currentLesson.id, "open");
        currentLesson.opened_at = currentLesson.opened_at || new Date().toISOString();
      } catch { /* non-fatal */ }
    }
    renderMain();
  }

  function attachEmbedProtections() {
    const frame = document.getElementById("embed-frame");
    if (!frame) return;
    frame.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      showToast("Kindly note that this is licensed content. You cannot copy or screenshot this material.");
    });
    frame.addEventListener("copy", (e) => {
      e.preventDefault();
      showToast("Kindly note that this is licensed content. You cannot copy or screenshot this material.");
    });
  }

  function renderMain() {
    const isEducator = session.user.role === "educator";
    const status = isEducator ? lessonStatusOf(currentLesson) : null;

    document.querySelector(".course-viewer").innerHTML = `
      <div>
        ${renderViewTabs()}
        <div class="embed-frame" id="embed-frame">${embedBodyHTML()}</div>
        ${
          isEducator && currentLesson
            ? `<div class="lesson-status-row">
                ${statusBadgeHTML(status)}
                <button class="btn btn-sm ${status === "completed" ? "btn-ghost" : "btn-primary"}" id="toggle-complete">
                  ${status === "completed" ? eq_icon("xCircle", 14) + " Mark as not completed" : eq_icon("checkCircle", 14) + " Mark as completed"}
                </button>
              </div>`
            : ""
        }
      </div>
      <div class="course-meta">
        ${
          lessons.length
            ? `<div class="panel">
                <div class="card-body">
                  <div class="lesson-picker-label">Currently viewing · Class ${currentLesson.sort_order}</div>
                  <h3 style="margin-bottom:14px; font-size:15px;">${eq_escapeHtml(currentLesson.title)}</h3>
                  ${moduleListHTML()}
                </div>
              </div>`
            : ""
        }
        ${
          currentView === "plan" && currentLesson
            ? `<div class="panel"><div class="card-body"><h3 style="font-size:14px; margin-bottom:8px;">Lesson plan document</h3>${lessonPlanDownloadHTML()}</div></div>`
            : ""
        }
        <div class="panel"><div class="card-body"><h3 style="font-size:14px; margin-bottom:8px;">About this curriculum</h3><p style="font-size:13px; color:var(--color-ink-soft); margin:0;">${eq_escapeHtml(course.summary || "")}</p></div></div>
        <div class="panel"><div class="card-body"><h3 style="font-size:14px; margin-bottom:8px;">Category</h3><p style="font-size:13px; color:var(--color-ink-soft); margin:0;">${eq_escapeHtml(course.category || "—")}</p></div></div>
        ${
          (session.user.role === "educator" || session.user.role === "hod")
            ? `<div class="panel"><div class="card-body"><button class="btn btn-ghost btn-sm btn-block" id="open-change-request">${eq_icon("edit", 14)} Request a change</button></div></div>`
            : ""
        }
      </div>
    `;

    document.querySelectorAll(".view-tab").forEach(btn => {
      btn.addEventListener("click", () => { currentView = btn.dataset.view; renderMain(); });
    });
    document.querySelectorAll(".module-item").forEach(btn => {
      btn.addEventListener("click", () => selectLesson(btn.dataset.lessonId));
    });

    const toggleBtn = document.getElementById("toggle-complete");
    if (toggleBtn) {
      toggleBtn.addEventListener("click", async () => {
        toggleBtn.disabled = true;
        const nextAction = status === "completed" ? "uncomplete" : "complete";
        try {
          await eq_setLessonStatus(currentLesson.id, nextAction);
          currentLesson.completed_at = nextAction === "complete" ? new Date().toISOString() : null;
          if (!currentLesson.opened_at) currentLesson.opened_at = new Date().toISOString();
          renderMain();
        } catch (err) {
          alert(err.message);
          toggleBtn.disabled = false;
        }
      });
    }

    const crBtn = document.getElementById("open-change-request");
    if (crBtn) crBtn.addEventListener("click", openChangeRequestForm);

    attachEmbedProtections();
  }

  function openChangeRequestForm() {
    if (document.getElementById("cr-overlay")) return;

    const overlay = document.createElement("div");
    overlay.id = "cr-overlay";
    overlay.className = "modal-overlay";
    overlay.innerHTML = `
      <div class="modal-card">
        <h3>Request a change</h3>
        <p class="modal-context">
          Course: <strong>${eq_escapeHtml(course.title)}</strong><br>
          Lecture: <strong>${eq_escapeHtml(currentLesson ? currentLesson.title : "—")}</strong>
        </p>
        <div class="field">
          <label for="cr-page">Page / slide (optional)</label>
          <input type="text" id="cr-page" placeholder="e.g. slide 4">
        </div>
        <div class="field">
          <label for="cr-text">What should be changed?</label>
          <textarea id="cr-text" rows="4" placeholder="e.g. I noticed this section contains an outdated wiring diagram."></textarea>
        </div>
        <p id="cr-error" style="color:var(--color-danger); font-size:13px; display:none;"></p>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn btn-ghost" id="cr-cancel" style="flex:1;">Cancel</button>
          <button class="btn btn-primary" id="cr-submit" style="flex:1;">Submit</button>
        </div>
      </div>
    `;
    document.body.appendChild(overlay);

    document.getElementById("cr-cancel").addEventListener("click", () => overlay.remove());
    overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.remove(); });

    document.getElementById("cr-submit").addEventListener("click", async () => {
      const text = document.getElementById("cr-text").value.trim();
      const errEl = document.getElementById("cr-error");
      if (!text) {
        errEl.textContent = "Please describe the change you're requesting.";
        errEl.style.display = "block";
        return;
      }
      try {
        await eq_submitChangeRequest({
          courseId: course.id,
          lessonId: currentLesson ? currentLesson.id : null,
          pageNote: document.getElementById("cr-page").value.trim(),
          requestText: text
        });
        overlay.remove();
        showToast("Request submitted — thank you.");
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      }
    });
  }

  (async () => {
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    eq_renderSidebarFooter(session.user);
    eq_renderTopbarUtilities();
    document.getElementById("nav-my-courses").innerHTML = `${eq_icon("book", 16)} My courses`;

    if (session.school) {
      eq_applyBranding(session.school);
      document.getElementById("school-tag").textContent = session.school.name;
    }

    const params = new URLSearchParams(window.location.search);
    const courseId = params.get("id");
    const viewer = document.getElementById("course-viewer");

    let data;
    try {
      data = await eq_getCourse(courseId);
    } catch (err) {
      document.getElementById("course-title").textContent = "Course not found";
      viewer.innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("alertTriangle", 30)}<h3>We couldn't load that course</h3><p>${eq_escapeHtml(err.message)}</p></div></div>`;
      return;
    }

    course = data.course;
    lessons = data.lessons;
    currentLesson = lessons[0] || null;
    document.getElementById("course-title").textContent = course.title;

    if (session.user.role === "educator" && currentLesson) {
      try {
        await eq_setLessonStatus(currentLesson.id, "open");
        currentLesson.opened_at = currentLesson.opened_at || new Date().toISOString();
      } catch { /* non-fatal */ }
    }

    if (data.license) {
      const cls = { active: "license-active", expired: "license-expired", upcoming: "license-upcoming", unset: "license-unset" }[data.license.status];
      document.getElementById("license-banner").innerHTML =
        `<div class="license-pill ${cls}">${eq_escapeHtml(data.license.label)}</div>`;
    }

    renderMain();
  })();
</script>

</body>
</html>
