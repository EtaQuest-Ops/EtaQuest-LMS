<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
      <div class="brand-name" data-brand-name>EtaQuest</div>
    </div>
    <nav class="nav-group" id="nav-group"></nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Users</h1>
        <div class="school-tag">Create accounts and assign roles</div>
      </div>
      <div class="topbar-right"><div id="topbar-utilities" style="display:flex; gap:8px; align-items:center;"></div></div>
    </div>

    <div class="content" id="content">
      <div class="empty-state"><h3>Loading…</h3></div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  let schools = [];

  function newUserFormHTML() {
    return `
      <div class="panel" style="margin-bottom:32px; max-width:520px;">
        <div class="panel-header"><h2>Create a user</h2></div>
        <div class="card-body">
          <div class="field"><label for="nu-name">Name</label><input type="text" id="nu-name"></div>
          <div class="field"><label for="nu-email">Email</label><input type="email" id="nu-email"></div>
          <div class="field"><label for="nu-password">Temporary password</label><input type="password" id="nu-password" autocomplete="new-password"></div>
          <div class="field">
            <label for="nu-role">Role</label>
            <select id="nu-role">
              <option value="educator">Educator</option>
              <option value="hod">Head of Department</option>
              <option value="admin">Super Admin</option>
            </select>
          </div>
          <div class="field" id="nu-school-field">
            <label for="nu-school">School</label>
            <select id="nu-school">${schools.map(s => `<option value="${s.id}">${eq_escapeHtml(s.name)}</option>`).join("")}</select>
          </div>
          <p id="nu-error" style="color:var(--color-danger); font-size:13px; display:none; margin-bottom:12px;"></p>
          <button class="btn btn-primary btn-block" id="nu-submit">${eq_icon("plus", 15)} Create user</button>
        </div>
      </div>
    `;
  }

  function roleBadge(role) {
    const map = { admin: ["Super Admin", "badge-admin"], hod: ["Head of Department", "badge-hod"], educator: ["Educator", "badge-educator"] };
    const [label, cls] = map[role] || [role, "badge-educator"];
    return `<span class="badge ${cls}">${label}</span>`;
  }

  async function renderUserList() {
    const users = await eq_getUsers();
    document.getElementById("user-list-panel").innerHTML = `
      <table>
        <thead><tr><th>User</th><th>Email</th><th>Role</th><th>School</th></tr></thead>
        <tbody>
          ${users.map(u => `
            <tr>
              <td><div class="table-user-cell">${eq_avatar(u.name, 28)} <span class="name">${eq_escapeHtml(u.name)}</span></div></td>
              <td>${eq_escapeHtml(u.email)}</td>
              <td>${roleBadge(u.role)}</td>
              <td>${eq_escapeHtml(u.school_name || "—")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>
    `;
  }

  (async () => {
    let session;
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    if (session.user.role !== "admin") {
      document.getElementById("content").innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("shield", 30)}<h3>Not available</h3><p>User management is Super Admin-only.</p></div></div>`;
      return;
    }

    document.getElementById("nav-group").innerHTML = `
      <div class="nav-label">Manage</div>
      <a class="nav-item" href="dashboard.html">${eq_icon("home", 16)} Overview</a>
      <a class="nav-item" href="admin-access.html">${eq_icon("shield", 16)} Course access &amp; licensing</a>
      <div class="nav-item active">${eq_icon("users", 16)} Users</div>
      <a class="nav-item" href="admin-change-requests.html">${eq_icon("clipboard", 16)} Change requests</a>
    `;
    eq_renderSidebarFooter(session.user);
    eq_renderTopbarUtilities();
    if (session.school) eq_applyBranding(session.school);

    schools = session.schools || [];

    document.getElementById("content").innerHTML = `
      ${newUserFormHTML()}
      <div class="section-heading"><h2>All users</h2></div>
      <div class="panel" id="user-list-panel"><div class="empty-state"><h3>Loading…</h3></div></div>
    `;

    const roleSelect = document.getElementById("nu-role");
    const schoolField = document.getElementById("nu-school-field");
    roleSelect.addEventListener("change", () => {
      schoolField.style.display = roleSelect.value === "admin" ? "none" : "block";
    });

    document.getElementById("nu-submit").addEventListener("click", async () => {
      const btn = document.getElementById("nu-submit");
      const errEl = document.getElementById("nu-error");
      errEl.style.display = "none";

      const name = document.getElementById("nu-name").value.trim();
      const email = document.getElementById("nu-email").value.trim();
      const password = document.getElementById("nu-password").value;
      const role = roleSelect.value;
      const schoolIdVal = document.getElementById("nu-school").value;

      if (!name || !email || !password) {
        errEl.textContent = "Name, email, and password are all required.";
        errEl.style.display = "block";
        return;
      }
      if (password.length < 8) {
        errEl.textContent = "Password must be at least 8 characters.";
        errEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Creating…";
      try {
        await eq_createUser({ name, email, password, role, schoolId: role === "admin" ? null : schoolIdVal });
        document.getElementById("nu-name").value = "";
        document.getElementById("nu-email").value = "";
        document.getElementById("nu-password").value = "";
        await renderUserList();
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      }
      btn.disabled = false;
      btn.innerHTML = `${eq_icon("plus", 15)} Create user`;
    });

    await renderUserList();
  })();
</script>

</body>
</html>
