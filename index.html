<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtaQuest LMS — Sign in</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-shell">

  <div class="login-hero">
    <svg class="hero-lines" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <circle cx="480" cy="120" r="90" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
      <circle cx="480" cy="120" r="6" fill="var(--brand-accent)" opacity="0.9"/>
      <line x1="480" y1="120" x2="560" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
      <circle cx="560" cy="60" r="4" fill="rgba(255,255,255,0.5)"/>
      <path d="M40 620 L140 620 L140 560 L220 560 L220 690 L300 690" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
      <circle cx="40" cy="620" r="5" fill="rgba(255,255,255,0.4)"/>
      <circle cx="300" cy="690" r="5" fill="var(--brand-accent)" opacity="0.8"/>
      <path d="M420 480 q 40 -60 80 0 t 80 0" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    </svg>

    <div class="wordmark">EtaQuest</div>

    <div class="hero-copy">
      <h1>One login. Your school's curriculum, automatically.</h1>
      <p>Sign in with your EtaQuest account — your school, branding, and courses are loaded from your profile.</p>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <img src="assets/etaquest-logo-full.jpg" alt="EtaQuest" class="login-logo">
      <div class="eyebrow">Sign in</div>
      <h2>Welcome back</h2>

      <form id="login-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@school.edu" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <p id="error-msg" style="color:var(--color-danger); font-size:13px; display:none; margin-bottom:14px;"></p>

        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
      </form>

      <p class="login-note">
        Trouble signing in? Contact your school administrator or EtaQuest support.
      </p>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  // If already logged in with a valid session, skip straight to the dashboard
  (async () => {
    if (eq_getToken()) {
      try {
        await eq_me();
        window.location.href = "dashboard.html";
      } catch {
        eq_clearToken();
      }
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    submitBtn.textContent = "Signing in…";
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await eq_login(email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorMsg.textContent = err.message || "Something went wrong. Please try again.";
      errorMsg.style.display = "block";
      submitBtn.textContent = "Sign in";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
