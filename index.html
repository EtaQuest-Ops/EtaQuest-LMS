<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EtaQuest LMS — Sign in</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-shell">
  <div class="login-card-outer">
    <img src="assets/etaquest-logo-full.jpg" alt="EtaQuest" class="login-logo">
    <div class="eyebrow">Sign in</div>
    <h2>Welcome back</h2>

    <form id="login-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@school.edu" required autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <p id="error-msg" style="color:var(--color-danger); font-size:13px; display:none; margin-bottom:14px;"></p>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign in</button>
    </form>

    <p class="login-note">
      Trouble signing in? Contact your school administrator or EtaQuest support.
    </p>
  </div>
</div>

<script src="app.js"></script>
<script>
  const form = document.getElementById("login-form");
  const errorMsg = document.getElementById("error-msg");
  const submitBtn = document.getElementById("submit-btn");

  (async () => {
    if (eq_getToken()) {
      try {
        await eq_me();
        window.location.href = "dashboard.html";
      } catch {
        eq_clearToken();
      }
    }
  })();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    submitBtn.textContent = "Signing in…";
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      await eq_login(email, password);
      window.location.href = "dashboard.html";
    } catch (err) {
      errorMsg.textContent = err.message || "Something went wrong. Please try again.";
      errorMsg.style.display = "block";
      submitBtn.textContent = "Sign in";
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
