<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-mark"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
      <div class="brand-name" data-brand-name>EtaQuest</div>
    </div>
    <nav class="nav-group">
      <div class="nav-label">Account</div>
      <a class="nav-item" href="dashboard.html" id="nav-overview"></a>
      <div class="nav-item active" id="nav-profile"></div>
    </nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div>
        <h1>Profile</h1>
        <div class="school-tag">Manage your own account details</div>
      </div>
      <div class="topbar-right"><div id="topbar-utilities" style="display:flex; gap:8px; align-items:center;"></div></div>
    </div>

    <div class="content">
      <div class="panel" style="max-width:480px;">
        <div class="card-body">
          <div style="display:flex; align-items:center; gap:14px; margin-bottom:22px;">
            <span id="profile-avatar"></span>
            <div>
              <div style="font-weight:700; font-size:16px;" id="profile-name-display">—</div>
              <div style="font-size:12.5px; color:var(--color-ink-faint);" id="profile-role-display">—</div>
            </div>
          </div>

          <div class="field">
            <label>Email</label>
            <input type="text" id="profile-email" disabled style="background:var(--color-surface-sunken); color:var(--color-ink-faint);">
          </div>
          <div class="field">
            <label>School</label>
            <input type="text" id="profile-school" disabled style="background:var(--color-surface-sunken); color:var(--color-ink-faint);">
          </div>
          <p style="font-size:12px; color:var(--color-ink-faint); margin-top:-8px; margin-bottom:20px;">
            Role and school assignment can only be changed by a Super Admin.
          </p>

          <div class="field">
            <label for="profile-name">Name</label>
            <input type="text" id="profile-name">
          </div>
          <div class="field">
            <label for="profile-password">New password (leave blank to keep current)</label>
            <input type="password" id="profile-password" placeholder="••••••••" autocomplete="new-password">
          </div>

          <p id="profile-error" style="color:var(--color-danger); font-size:13px; display:none; margin-bottom:12px;"></p>
          <p id="profile-success" style="color:var(--color-success); font-size:13px; display:none; margin-bottom:12px;">Saved.</p>

          <button class="btn btn-primary btn-block" id="save-profile">Save changes</button>
        </div>
      </div>
    </div>
  </div>

</div>

<script src="app.js"></script>
<script>
  (async () => {
    let session;
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    document.getElementById("nav-overview").innerHTML = `${eq_icon("home", 16)} Overview`;
    document.getElementById("nav-profile").innerHTML = `${eq_icon("user", 16)} Profile`;
    eq_renderSidebarFooter(session.user);
    eq_renderTopbarUtilities();
    if (session.school) eq_applyBranding(session.school);

    const profile = await eq_getProfile();
    document.getElementById("profile-avatar").innerHTML = eq_avatar(profile.name, 44);
    document.getElementById("profile-name-display").textContent = profile.name;
    document.getElementById("profile-role-display").textContent = eq_roleLabel(profile.role);
    document.getElementById("profile-email").value = profile.email;
    document.getElementById("profile-school").value = session.school ? session.school.name : "All schools";
    document.getElementById("profile-name").value = profile.name;

    document.getElementById("save-profile").addEventListener("click", async () => {
      const btn = document.getElementById("save-profile");
      const errEl = document.getElementById("profile-error");
      const okEl = document.getElementById("profile-success");
      errEl.style.display = "none";
      okEl.style.display = "none";

      const name = document.getElementById("profile-name").value.trim();
      const newPassword = document.getElementById("profile-password").value;

      if (newPassword && newPassword.length < 8) {
        errEl.textContent = "Password must be at least 8 characters.";
        errEl.style.display = "block";
        return;
      }

      const updates = {};
      if (name && name !== profile.name) updates.name = name;
      if (newPassword) updates.newPassword = newPassword;

      if (!Object.keys(updates).length) {
        okEl.textContent = "Nothing to save.";
        okEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Saving…";
      try {
        await eq_updateProfile(updates);
        if (updates.name) {
          profile.name = updates.name;
          document.getElementById("profile-name-display").textContent = updates.name;
          document.getElementById("profile-avatar").innerHTML = eq_avatar(updates.name, 44);
          eq_renderSidebarFooter({ ...session.user, name: updates.name });
        }
        document.getElementById("profile-password").value = "";
        okEl.textContent = "Saved.";
        okEl.style.display = "block";
      } catch (err) {
        errEl.textContent = err.message;
        errEl.style.display = "block";
      }
      btn.disabled = false;
      btn.textContent = "Save changes";
    });
  })();
</script>

</body>
</html>
