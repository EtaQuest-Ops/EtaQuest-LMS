<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Requests — EtaQuest LMS</title>
<link rel="icon" href="assets/etaquest-logo-icon.jpg">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
  <nav class="rail">
    <div class="rail-logo"><img src="assets/etaquest-logo-icon.jpg" alt="EtaQuest"></div>
    <div class="rail-nav" id="rail-nav"></div>
    <div class="rail-footer" id="rail-footer"></div>
  </nav>

  <main class="workspace">
    <header class="workspace-header">
      <div>
        <h1>Change requests</h1>
        <div class="workspace-sub">Feedback submitted by educators and HODs about course material</div>
      </div>
    </header>
    <div class="workspace-content" id="content">
      <div class="empty-state"><h3>Loading…</h3></div>
    </div>
  </main>
</div>

<script src="app.js"></script>
<script>
  const STATUS_OPTIONS = ["pending", "reviewed", "resolved", "rejected"];
  const STATUS_LABEL = { pending: "Pending", reviewed: "Reviewed", resolved: "Resolved", rejected: "Rejected" };

  function timeAgo(dateStr) {
    if (!dateStr) return "—";
    const diffMs = Date.now() - new Date(dateStr + "Z").getTime();
    const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    if (days <= 0) return "Today";
    if (days === 1) return "Yesterday";
    return `${days} days ago`;
  }

  async function renderRequests() {
    const content = document.getElementById("content");
    const requests = await eq_getChangeRequests();

    if (!requests.length) {
      content.innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("clipboard", 30)}<h3>No requests yet</h3><p>Change requests submitted by educators and HODs will show up here.</p></div></div>`;
      return;
    }

    content.innerHTML = requests.map(r => `
      <div class="panel" data-id="${r.id}">
        <div class="panel-header">
          <div>
            <h2 style="font-size:14px;">${eq_escapeHtml(r.course_title)}${r.lesson_title ? ` — ${eq_escapeHtml(r.lesson_title)}` : ""}</h2>
            <span class="count">${eq_escapeHtml(r.user_name)} (${r.user_role === "hod" ? "HOD" : "Educator"}) · ${timeAgo(r.created_at)}${r.page_note ? ` · ${eq_escapeHtml(r.page_note)}` : ""}</span>
          </div>
          <select class="cr-status">
            ${STATUS_OPTIONS.map(s => `<option value="${s}" ${s === r.status ? "selected" : ""}>${STATUS_LABEL[s]}</option>`).join("")}
          </select>
        </div>
        <div class="card-body">
          <p style="font-size:14px; color:var(--color-ink); margin:0;">${eq_escapeHtml(r.request_text)}</p>
        </div>
      </div>
    `).join("");

    content.querySelectorAll(".cr-status").forEach(select => {
      select.addEventListener("change", async (e) => {
        const id = e.target.closest(".panel").dataset.id;
        select.disabled = true;
        try {
          await eq_setChangeRequestStatus(id, select.value);
        } catch (err) {
          alert(err.message);
        }
        select.disabled = false;
      });
    });
  }

  (async () => {
    let session;
    try {
      session = await eq_me();
    } catch {
      window.location.href = "index.html";
      return;
    }

    if (session.user.role !== "admin") {
      document.getElementById("content").innerHTML = `<div class="panel"><div class="empty-state">${eq_icon("shield", 30)}<h3>Not available</h3><p>Change requests are visible to Super Admin only.</p></div></div>`;
      return;
    }

    eq_renderRailNav([
      { href: "dashboard.html", icon: "home", label: "Overview" },
      { href: "admin-access.html", icon: "shield", label: "Course access & licensing" },
      { href: "admin-users.html", icon: "users", label: "Users" },
      { href: null, icon: "clipboard", label: "Change requests", active: true }
    ]);
    eq_renderRailFooter(session.user);
    if (session.school) eq_applyBranding(session.school);

    await renderRequests();
  })();
</script>

</body>
</html>
